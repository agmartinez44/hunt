# Fictional example workspace. Copy to $HUNT_DATA.
# Runtime / CLI will read this; hunt.cv only needs knowledge/.
# Tax rates and the floor are illustrative for Jane Doe — not tax advice.

bind: "127.0.0.1"
port: 8787
hours_per_month: 160
days_per_month: 21
display_currency: EUR
comp_floor:
  amount: 7000
  currency: EUR
  unit: month
fx:
  as_of: "2026-09-01"
  rates:
    EUR: 1.0
    USD: 0.90
    GBP: 1.15
    PLN: 0.23
    CHF: 1.05
# Operator-updatable estimate tables (not tax advice).
# Net = gross − social − income. social = gross*social_rate + FX(social_fixed_month).
# income = income_base * income_rate (income_base defaults to gross).
# vat_out: quoted B2B/JDG/autónomo is treated as ex-VAT revenue.
tax_homes:
  CH:
    fte:
      income_rate: 0.16
      social_rate: 0.064
      vat_out: false
      source: "example 2026 blended federal+canton income + employee AHV/ALV — estimate, not tax advice"
    freelance:
      income_rate: 0.16
      social_rate: 0.10
      vat_out: true
      source: "example 2026 self-employed AHV + income estimate; VAT-out for B2B quotes"
  ES:
    fte:
      income_rate: 0.24
      social_rate: 0.065
      vat_out: false
      source: "example 2026 IRPF withholding + employee SS — estimate, not tax advice"
    freelance:
      income_rate: 0.20
      social_fixed_month: 300
      social_fixed_currency: EUR
      vat_out: true
      source: "example 2026 autónomo cuota + IRPF; VAT-out"
  PL:
    fte:
      income_rate: 0.12
      social_rate: 0.1371
      vat_out: false
      source: "example 2026 PIT 12% first-bracket + employee ZUS — estimate, not tax advice"
    freelance:
      income_rate: 0.12
      social_fixed_month: 400
      social_fixed_currency: EUR
      vat_out: true
      source: "example 2026 JDG ryczałt 12% IT + ZUS lump; VAT-out for B2B quotes"
worker:
  backend: none
cv:
  filename_pattern: "{name}_CV"
# Default runner is a harness you already run (OpenCode / Claude / Codex).
# Hunt does not vendor a tool loop. Hosted default is SpaceXAI / xAI.
# Put XAI_API_KEY in secrets.env (never plaintext here). BYO = any
# OpenAI-compat URL, e.g. local llama.cpp at http://127.0.0.1:8080/v1.
agent:
  harness: auto   # auto | opencode | claude | cursor | codex | paperclip | openclaw
  model:
    base_url: https://api.x.ai/v1
    api_key_env: XAI_API_KEY
    model: grok-4.5
  triage:
    enabled: false
    auto_dismiss: true
    batch_size: 8
    max_cards: 8
    reason_max_chars: 80
    wake_min_survivors: 1
    keep_hint: ""
    geo_hint: ""
    model:
      base_url: http://127.0.0.1:8080/v1
      api_key_env: ""
      model: gemma-4-E4B
# Workspace knockouts (data, not hardcoded in Hunt). Missing pay → pay_unknown.
# title_exclude is phrase-substring (same as title_include). Lists stay empty here
# so merging this tree cannot dismiss live rows. Do not use bare intern as a token
# — it matches Polish internetowej. Phrase tokens (live YAML, not this file):
# internship, "intern " (prefix), " intern " (both spaces). Not " intern".
knockouts:
  title_include: []
  title_exclude: []
  experience_block: []
  modality_block: []
  engagement_allow: []
  languages_block: []
  drop_on: []
# Fictional adapters. http_json uses in-tree fixtures, not live boards.
# Drop `path` on remotive-eu / landing-jobs-eu to poll the live GET APIs.
# landing query.q as a list fans out one GET per term (union by external_id).
# justjoin query.categories as a list is one GET with repeated categories= (OR).
# Do not set query.q on justjoin or remotive.
# imap_alerts stays disabled until secrets.env provides IMAP_* credentials.
sources:
  - id: justjoin-sample
    kind: http_json
    name: JustJoin sample (offline fixture)
    enabled: true
    config:
      profile: justjoin
      path: fixtures/justjoin.json
      # Live: drop path; categories list → repeated categories= (one GET, OR).
  - id: remotive-eu
    kind: http_json
    name: Remotive EU / Europe remote IT
    enabled: true
    config:
      profile: remotive
      path: fixtures/remotive.json
  - id: landing-jobs-eu
    kind: http_json
    name: Landing.jobs EU tech
    enabled: true
    config:
      profile: landing_jobs
      path: fixtures/landing_jobs.json
      # Live: drop path; query.q list fans out one GET per term.
  - id: mail-alerts
    kind: imap_alerts
    name: Job alert mailbox
    enabled: false
    config:
      folder: INBOX
      host_env: IMAP_HOST
      user_env: IMAP_USER
      password_env: IMAP_PASSWORD
      from_contains: ["jobs.example.org"]
      subject_contains: ["job alert"]
      company_default: Job alert
