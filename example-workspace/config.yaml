# Fictional example workspace. Copy to $HUNT_DATA.
# Runtime / CLI will read this; hunt.cv only needs knowledge/.
# Tax rates and the floor are illustrative for Jane Doe — not tax advice.

bind: "127.0.0.1"
port: 8787
hours_per_month: 160
days_per_month: 21
display_currency: EUR
comp_floor:
  amount: 7000
  currency: EUR
  unit: month
fx:
  as_of: "2026-09-01"
  rates:
    EUR: 1.0
    USD: 0.90
    GBP: 1.15
    PLN: 0.23
    CHF: 1.05
tax_homes:
  pl_jdg:
    effective_rate: 0.17
  es_autonomo:
    effective_rate: 0.30
  ch_fte:
    effective_rate: 0.22
  us_1099:
    effective_rate: 0.28
worker:
  backend: none
cv:
  filename_pattern: "{name}_CV"
# Workspace knockouts (data, not hardcoded in Hunt). Missing pay → pay_unknown.
knockouts:
  title_include: []
  modality_block: []
  engagement_allow: []
  languages_block: []
  drop_on: []
# Fictional adapters. http_json uses the in-tree fixture, not a live board.
# imap_alerts stays disabled until secrets.env provides IMAP_* credentials.
sources:
  - id: justjoin-sample
    kind: http_json
    name: JustJoin sample (offline fixture)
    enabled: true
    config:
      profile: justjoin
      path: fixtures/justjoin.json
  - id: mail-alerts
    kind: imap_alerts
    name: Job alert mailbox
    enabled: false
    config:
      folder: INBOX
      host_env: IMAP_HOST
      user_env: IMAP_USER
      password_env: IMAP_PASSWORD
      from_contains: ["jobs.example.org"]
      subject_contains: ["job alert"]
      company_default: Job alert
